<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="profilestyle.css">
</head>
<body>
    <! -- /*Profile box*/--> 
    <div class="profile">
        <div class="blue_border"><h1>PROFILE</h1>
        <div class="activation">
            <! -- /* Activation button*/ --> 
            <div class="green_box"></div>
            <h2 class="active">ACTIVE</h2></div>
        </div>
        <! --Logo --> 
        <img src="profile logo.png" class="profile_logo" alt="Image"/>
     </div>
     <! -- Name Image and elements--> 

     <div class="grid-container">
        <img src="Name.png" alt="Your Image" class="grid-image">
        <div><div class="grid-item1"><h2>Name</h2></div>
        <div class="grid-item2">
            <! -- The username as an input element--> 
            <input class="username_input"type="text" placeholder="Username" id="username"></div></div>
    </div>

    <! --User Id and elements --> 
    <div class="grid-container">
        <img src="Department.png" alt="Your Image" class="grid-image">
        <div><div class="grid-item1"><h2>User Id</h2></div>
        <div class="grid-item2">3668758</div></div>
    </div>

    <! --Phone no. and elements --> 
      <div class="grid-container">
        <img src="Phone.png" alt="Your Image" class="grid-image">
        <div><div class="grid-item1"><h2>Phone no.</h2></div>
        <div class="grid-item2">
            <! --The phone number as an input element --> 
            <input class="no_input" type="text" placeholder="+98 456856879">
        </div>
    </div>
    </div>

    <! -- Email and elements--> 
    <div class="grid-container">
        <img src="Email.png" alt="Your Image" class="grid-image">
        <div><div class="grid-item1"><h2>E-Mail</h2></div>
        <div class="grid-item2">miketyson@gmail.com</div></div>
    </div>

    <! -- Log out link--> 
    <div><a href="" style="text-decoration: none;"><h2 class="log_out" ><b>Log Out</b></h2></a></div>
</body>
</html>
