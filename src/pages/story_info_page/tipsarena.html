<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tips Arena - Top Stories</title>
    <link rel="stylesheet" href="tipsarena.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
</head>
<body>
    <header>
        <div class="logo">
            <img src="../../../assets/TIPSarena.png" alt="TIPSarena Logo">
        </div>
          
        <div class="menu-logo">
            <div class="menu-btn" onclick="toggleDrawer()">☰</div>

            <!-- Drawer overlay -->
            <div class="drawer-overlay" id="drawer-overlay"></div>

            <!-- Navigation drawer -->
            <div class="drawer" id="drawer">
                <div class="drawer-logo">
                    <!-- <img src="../../assets/TIPSarena.png" alt="TIPSarena Logo"> -->
                </div>
                <nav class="drawer-nav">
                    <ul>
                        <li><a href="../../../public/index.html">Home</a></li>
                        <li><a href="../predictions/predictions.html">Predictions</a></li>
                        <li><a href="../live-line/live-line.html">Live Line</a></li>
                        <li><a href="tipsarena.html">Blog</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <h2>Top stories</h2>
        <div class="news-container" id="news-container">
           
        </div>

        <div class="match-summary">
            <div class="match-header">
                <img src="Images/download.jpeg" alt="Match Image">
                <div class="match-info">
                    <h3>PRESSURE MOUNTS ON AMORIM AFTER MATETA BRACE FIRES PALACE TO MAN UTD WIN</h3>
                    <p class="matchday">MATCHDAY 24</p>
                    <span class="completed">COMPLETED</span>
                </div>
            </div>

            <div class="match-score">
                <div class="team">
                    <span class="team-name">MANCHESTER UNITED</span>
                    <img src="Images/download (1).png" alt="Man Utd">
                </div>
                <div class="score-box">
                    <span class="score">0</span>
                    <span class="score">2</span>
                </div>
                <div class="team">
                    <img src="Images/download.png" alt="Crystal Palace">
                    <span class="team-name">CRYSTAL PALACE</span>
                </div>
            </div>
        </div>
    </main>

    <script src="./script/story.js"></script>
    
</body>
</html>
