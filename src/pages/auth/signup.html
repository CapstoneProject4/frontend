<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="signupstyle.css">
</head>
<body>

    <div class="intro">
        <img src="../../../assets/tipsarena logo.jpg" alt="TIPSarena Logo">
        <h2>Create an Account</h2>
        <p>Enter your email and password to sign up.</p>
    </div>

    <form>
        <input type="email" placeholder="example@email.com" id="email" required>
        <input type="password" placeholder="password" id="password" required>
        <button id="signup" class="email_button">Sign up with email</button>
    </form>

    <div class="foo">
        <span>or continue with</span>
    </div>

    <button id="google-signin" class="google_button">
        <img src="../../../assets/google.jpg" width="60px" alt="Google Logo">
        Google
    </button>

    <p class="terms">By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>

    <div class="login">
        <p>Already have an account? 
            <a href="login.html"><button class="signup_button">Login</button></a>
        </p>
    </div>

    <script type="module" src="../../../public/js/firebase-auth.js"></script>
</body>
</html>
