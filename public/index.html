<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIPSArena Log In</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      }

      body {
        background-color: white;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }

      .status-bar {
        background-color: #000;
        color: white;
        padding: 4px 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 12px;
      }

      .container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px;
        max-width: 400px;
        margin: 0 auto;
        width: 100%;
      }

      .logo-container {
        text-align: center;
        margin-bottom: 20px;
      }

      .logo-text {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .logo-text span {
        color: #0066cc;
      }

      .logo-image {
        width: 80px;
        height: 80px;
        margin: 0 auto;
        background-color: #0066cc;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-size: 20px;
        position: relative;
        overflow: hidden;
      }

      .logo-image::before {
        content: "";
        position: absolute;
        width: 40px;
        height: 30px;
        background-color: white;
        border-radius: 50%;
        top: 20px;
        left: 20px;
      }

      .logo-image::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 15px;
        background-color: white;
        border-radius: 50%;
        top: 40px;
        left: 25px;
      }

      .signup-form {
        width: 100%;
        text-align: center;
      }

      .title {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .subtitle {
        font-size: 14px;
        color: #666;
        margin-bottom: 20px;
      }

      .input-field {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }

      .btn {
        width: 100%;
        padding: 12px;
        background-color: #f5f5f5;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
        margin-bottom: 15px;
        cursor: pointer;
        color: #333;
      }

      .btn-primary {
        background-color: #f5f5f5;
        color: #333;
      }

      .separator {
        display: flex;
        align-items: center;
        margin: 15px 0;
        color: #999;
        font-size: 12px;
      }

      .separator-line {
        flex: 1;
        height: 1px;
        background-color: #ddd;
      }

      .separator-text {
        margin: 0 10px;
      }

      .btn-google {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .google-icon {
        width: 18px;
        height: 18px;
        margin-right: 10px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .terms {
        font-size: 12px;
        color: #999;
        margin: 15px 0;
        text-align: center;
      }

      .terms a {
        color: #666;
        text-decoration: none;
      }

      .footer {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: auto;
        padding: 20px;
        font-size: 14px;
      }

      .login-btn {
        background-color: #000;
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 20px;
        margin-left: 10px;
        cursor: pointer;
        font-size: 12px;
      }

      .bottom-bar {
        width: 40%;
        height: 5px;
        background-color: #ddd;
        border-radius: 3px;
        margin: 15px auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo-container">
        <div class="logo-text">TIPS<span>Arena</span></div>
        <div class="logo-image">⚽</div>
      </div>

      <div class="signup-form">
        <h2 class="title">Log in to TipsArena</h2>
        <p class="subtitle">Enter your email to log in for TIPSArena</p>

        <input type="email" class="input-field" placeholder="email@gmail.com" />
        <button class="btn btn-primary">Log in with email</button>

        <div class="separator">
          <div class="separator-line"></div>
          <div class="separator-text">or continue with</div>
          <div class="separator-line"></div>
        </div>

        <button class="btn btn-google">
          <div class="google-icon">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
          </div>
          Google
        </button>

        <p class="terms">
          By clicking continue, you agree to our
          <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
        </p>
      </div>
    </div>

    <div class="footer">
      <span>Already have an Account</span>
      <button class="login-btn">Log In</button>
    </div>

    <div class="bottom-bar"></div>
  </body>
</html>
